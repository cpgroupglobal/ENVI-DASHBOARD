function faqLookup(qn){
  let best=null, bestScore=0;
  FAQ.forEach(item=>{
    let score=0;
    item.kw.forEach(k=>{ if(qn.includes(k)) score += k.length; });
    if(score>bestScore){ bestScore=score; best=item; }
  });
  return bestScore>0 ? best : null;
}

function norm(s){ return s.toLowerCase().replace(/\s+/g,' ').trim(); }

function detectDomain(q){
  if(/ขยะ|ของเสีย|waste|กากอุตสาหกรรม/i.test(q)) return 'waste';
  if(/น้ำ|water/i.test(q)) return 'water';
  if(/พลังงาน|ghg|ก๊าซเรือนกระจก|คาร์บอน|โซลาร์|solar|energy|เชื้อเพลิง|scope\s*[12]|สโคป\s*[12]|renewable|หมุนเวียน|ชีวมวล|biomass|biogas|ไฟฟ้า/i.test(q)) return 'energy';
  return null;
}

function detectYear(q, years){
  const m = q.match(/20[12]\d/);
  if(m && years.includes(parseInt(m[0]))) return parseInt(m[0]);
  if(/ปีที่แล้ว|ปีก่อน/.test(q)) return years[years.length-2];
  return years[years.length-1];
}

function squash(s){ return s.replace(/[\s\-_.']/g,''); }

function detectBU(qn, domainData){
  const buKeys = Object.keys(domainData.bu);
  const qs = squash(qn);
  let best = null, bestLen = 0;
  buKeys.forEach(key=>{
    const aliases = (ALIASES[key]||[]).concat([key.toLowerCase()]);
    aliases.forEach(a=>{
      const as = squash(a);
      const hit = (a.length>=3 && qn.includes(a)) || (as.length>=3 && qs.includes(as));
      if(hit && as.length>bestLen){ best = key; bestLen = as.length; }
    });
  });
  return best;
}

function detectMetric(qn, domain){
  const table = METRICS[domain];
  for(const key in table){
    for(const p of table[key].patterns){
      if(qn.includes(p)) return key;
    }
  }
  return null;
}

function fmt(v, unit){
  if(v===undefined || v===null) return 'ไม่พบข้อมูล';
  const n = Number(v);
  let digits = 0;
  if(unit==='%') digits = 1;
  else if(Math.abs(n) < 100 && n !== 0) digits = 2;
  return n.toLocaleString('th-TH', {maximumFractionDigits:digits, minimumFractionDigits: digits>0?0:0}) + ' ' + unit;
}

function listOut(obj, unit){
  const entries = Object.entries(obj).filter(e=>e[1]!==undefined && e[1]!==null);
  entries.sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,e)=>s+e[1],0);
  return entries.map(e=>{
    const pct = total ? ' ('+(e[1]/total*100).toFixed(1)+'%)' : '';
    return '  • '+lab(e[0])+': '+fmt(e[1], unit)+pct;
  }).join('\n');
}

function getDetail(dData, bu, year){
  if(bu) return dData.detail.bu[bu] && dData.detail.bu[bu][String(year)];
  return dData.detail.group[String(year)];
}

      const g = det.ghg;

      if(wantS1){
        const s1total = g.s1_stationary+g.s1_fugitive+g.s1_mobile+(g.s1_other||0);

    }
    if(/แยก|รายละเอียด|breakdown|สัดส่วน|ประเภท|เชิงลึก/.test(qn)){
      return { text: head+'\nโครงสร้างการใช้พลังงาน:\n'+listOut({fossil:det.energy.fossil, renewable:det.energy.renewable, electricity:det.energy.electricity},'GJ'), src: SOURCE_LABEL.energy };

function seriesFor(domain, dData, metricKey, bu){
  const src = bu ? dData.bu[bu] : dData.group;
  if(!src) return null;
  if(domain==='energy' && metricKey==='renewable'){
    return dData.years.map((y,i)=>{
      const en = src.energy[i];
      return en ? (src.renewable[i]/en*100) : 0;
    });
  }
  return src[metricKey] ? src[metricKey].slice() : null;
}

function yoyLine(series, yi, unit, goodDir){
  if(yi<=0 || !series) return '';
  const cur = series[yi], prev = series[yi-1];
  if(!prev) return '';
  const diff = cur - prev;
  const pct = Math.abs(diff/prev*100);
  const up = diff > 0;
  const word = up ? 'เพิ่มขึ้น' : 'ลดลง';
  const arrow = up ? '▲' : '▼';
  let verdict = '';
  if(goodDir){
    const good = (goodDir==='down' && !up) || (goodDir==='up' && up);
    verdict = good ? ' — ไปในทางที่ดีขึ้น' : ' — ต้องจับตา';
  }
  return arrow+' '+word+' '+pct.toFixed(1)+'% จากปีก่อน ('+fmt(prev,unit)+')'+verdict;
}

function sparkSVG(series, years, unit, goodDir){
  const w = 268, h = 74, pad = 14, bw = (w - pad*2) / series.length;
  const max = Math.max.apply(null, series.map(Math.abs)) || 1;
  let bars = '';
  series.forEach((v,i)=>{
    const bh = Math.max(Math.abs(v)/max*42, 2);
    const x = pad + i*bw + bw*0.18;
    const y = 50 - bh;
    const last = i === series.length-1;
    const col = last ? '#173404' : '#9bc06a';
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+col+'"/>';
    bars += '<text x="'+(x+bw*0.32).toFixed(1)+'" y="64" font-size="8.5" fill="#52514e" text-anchor="middle">'+years[i]+'</text>';
  });
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="แนวโน้ม '+years[0]+'-'+years[years.length-1]+'">'+bars+'</svg>';
}

function rankLine(domain, dData, metricKey, year, bu){
  if(!bu) return '';
  const rows = rankBUs(domain, dData, metricKey, year);
  const idx = rows.findIndex(r=>r[0]===bu);
  if(idx < 0) return '';
  const total = rows.reduce((s,r)=>s+r[1],0);
  const share = (METRICS[domain][metricKey].unit === '%') ? '' :
    ' คิดเป็น '+(rows[idx][1]/total*100).toFixed(1)+'% ของทั้งกลุ่ม';
  return 'อยู่อันดับ '+(idx+1)+' จาก '+rows.length+' BU'+share;
}

function sbtiAnswer(year){
  const D = DATA_ENERGY;
  const ti = D.target.years.indexOf(year);
  const ai = D.years.indexOf(year);
  if(ti < 0 || ai < 0) return null;
  const actual = D.group.ghg[ai];
  const target = D.target.target[ti]*1e6;
  const baseline = D.target.baseline*1e6;
  const goal = D.target.goal2030*1e6;
  const gap = actual - target;
  const gapPct = Math.abs(gap/target*100);
  const vsBase = (actual-baseline)/baseline*100;
  const status = gap <= 0
    ? '✓ ต่ำกว่าเส้นเป้าหมาย '+fmt(Math.abs(gap),'tCO2e')+' ('+gapPct.toFixed(1)+'%)'
    : '⚠ สูงกว่าเส้นเป้าหมาย '+fmt(gap,'tCO2e')+' ('+gapPct.toFixed(1)+'%)';
  const txt = 'เป้าหมาย SBTi — ลด GHG (Scope 1+2) ลง 42% ภายในปี 2030 เทียบฐานปี 2021\n\n'
    + 'ปี '+year+'\n'
    + '  ค่าจริง: '+fmt(actual,'tCO2e')+'\n'
    + '  เส้นเป้าหมายปีนี้: '+fmt(target,'tCO2e')+'\n'
    + '  สถานะ: '+status+'\n\n'
    + 'เทียบฐานปี 2021 ('+fmt(baseline,'tCO2e')+'): '+(vsBase<0?'ลดลง ':'เพิ่มขึ้น ')+Math.abs(vsBase).toFixed(1)+'%\n'
    + 'เป้าปี 2030: '+fmt(goal,'tCO2e')+' (ต้องลดอีก '+fmt(actual-goal,'tCO2e')+' จากปัจจุบัน)';
  const ay = D.years.filter(y=>y>=2021);
  const av = ay.map(y=>D.group.ghg[D.years.indexOf(y)]);
  return { text: txt, src: SOURCE_LABEL.energy, chart: { series: av, years: ay, unit:'tCO2e' } };
}

function intensityAnswer(qn, year){
  const wantGhg = /ghg|ก๊าซเรือนกระจก|คาร์บอน/.test(qn);
  const D = DATA_ENERGY;
  const yi = D.years.indexOf(year);
  const rev = D.group.revenue;
  if(!rev || !rev[yi]) return null;
  const key = wantGhg ? 'ghg' : 'energy';
  const unit = wantGhg ? 'tCO2e / ล้านบาท' : 'GJ / ล้านบาท';
  const label = wantGhg ? 'GHG Intensity (GRI 305-4)' : 'Energy Intensity (GRI 302-3)';
  const series = D.years.map((y,i)=> rev[i] ? D.group[key][i]/rev[i] : 0);
  const cur = series[yi];
  let txt = label+' — CP Group ปี '+year+'\n\n'
    + '  '+cur.toFixed(2)+' '+unit+'\n'
    + '  (จาก '+fmt(D.group[key][yi], wantGhg?'tCO2e':'GJ')+' ÷ รายได้ '+Number(rev[yi]).toLocaleString('th-TH')+' ล้านบาท)';
  const yl = yoyLine(series, yi, unit, 'down');
  if(yl) txt += '\n\n'+yl;
  return { text: txt, src: SOURCE_LABEL.energy, chart:{ series: series, years: D.years, unit: unit } };
}

const OPENERS = ['ได้เลยค่ะ','ตัวเลขที่ถามมาค่ะ','ดูให้แล้วค่ะ','นี่ค่ะ'];
let openerIdx = 0;
function opener(){ const o = OPENERS[openerIdx % OPENERS.length]; openerIdx++; return o; }

function detectAllBU(qn){
  return /ทุก\s*bu|ทุกหน่วยธุรกิจ|ทุกบียู|all bu|เทียบ|เปรียบเทียบ|อันดับ|ranking|จัดอันดับ|แต่ละ\s*bu|ราย\s*bu|รายบียู|ทุกบริษัท/.test(qn);
}

function rankBUs(domain, dData, metricKey, year){
  const yi = dData.years.indexOf(year);
  const rows = Object.keys(dData.bu).map(name=>{
    const s = dData.bu[name][metricKey];
    let v = s ? (s[yi]||0) : 0;
    if(domain==='energy' && metricKey==='renewable'){
      const en = dData.bu[name].energy[yi];
      v = en ? (dData.bu[name].renewable[yi]/en*100) : 0;
    }
    return [name, v];
  }).filter(r=>r[1]>0);
  rows.sort((a,b)=>b[1]-a[1]);
  return rows;
}

function buProfile(bu, year){
  let out = bu+' — สรุปทุกหมวด ปี '+year+'\n';
  const eD = DATA_ENERGY, wD = DATA_WATER, sD = DATA_WASTE;
  const ei = eD.years.indexOf(year), wi = wD.years.indexOf(year), si = sD.years.indexOf(year);

  if(eD.bu[bu]){
    const en = eD.bu[bu].energy[ei], re = eD.bu[bu].renewable[ei], gh = eD.bu[bu].ghg[ei];
    const det = eD.detail.bu[bu] && eD.detail.bu[bu][String(year)];
    out += '\n[ พลังงาน / GHG ]\n'
      + '  พลังงานรวม: '+fmt(en,'GJ')+'\n'
      + '  พลังงานหมุนเวียน: '+fmt(re,'GJ')+(en?' ('+(re/en*100).toFixed(1)+'%)':'')+'\n'
      + '  GHG รวม: '+fmt(gh,'tCO2e')+'\n';
    if(det){
      const g = det.ghg;
      const s1 = g.s1_stationary+g.s1_fugitive+g.s1_mobile+(g.s1_other||0);
      out += '    Scope 1: '+fmt(s1,'tCO2e')+'  |  Scope 2: '+fmt(g.s2,'tCO2e')+'\n'
           + '    โครงสร้างพลังงาน: ฟอสซิล '+fmt(det.energy.fossil,'GJ')
           + ' / หมุนเวียน '+fmt(det.energy.renewable,'GJ')
           + ' / ไฟฟ้า '+fmt(det.energy.electricity,'GJ')+'\n';
    }
  } else { out += '\n[ พลังงาน / GHG ] ไม่มีข้อมูล\n'; }

  if(wD.bu[bu]){
    const b = wD.bu[bu];
    out += '\n[ น้ำ ]\n'
      + '  ดึงน้ำมาใช้: '+fmt(b.withdrawal[wi],'m³')+'\n'
      + '  ใช้น้ำ: '+fmt(b.consumption[wi],'m³')+'\n'
      + '  ระบายน้ำ: '+fmt(b.discharge[wi],'m³')+'\n'
      + '  นำกลับมาใช้: '+fmt(b.recycled[wi],'m³')+'\n';
  } else { out += '\n[ น้ำ ] ไม่มีข้อมูล\n'; }

  if(sD.bu[bu]){
    const b = sD.bu[bu];
    out += '\n[ ของเสีย ]\n'
      + '  เกิดขึ้นรวม: '+fmt(b.generated[si],'ตัน')+'\n'
      + '  นำกลับมาใช้ประโยชน์: '+fmt(b.diverted[si],'ตัน')+'\n'
      + '  ส่งกำจัด: '+fmt(b.directed[si],'ตัน')+'\n'
      + '  ของเสียอันตราย: '+fmt(b.hazardous[si],'ตัน')+'\n'
      + '  Diversion Rate: '+fmt(b.diversion_rate[si],'%')+'\n';
  } else { out += '\n[ ของเสีย ] ไม่มีข้อมูล\n'; }

  out += '\n(พิมพ์ชื่อ BU + "scope 1", "แหล่งน้ำ" หรือ "วิธีกำจัด" เพื่อดูลึกลงไปอีก)';
  return out;
}

function answer(qRaw){
  const qn = norm(qRaw);

  if(/รายชื่อ\s*bu|มี\s*bu\s*อะไร|bu\s*ทั้งหมดมีอะไร|list bu/.test(qn)){
    const names = Object.keys(DATA_ENERGY.bu);
    return { text:'BU ที่มีข้อมูลทั้งหมด '+names.length+' หน่วย:\n'+names.map(n=>'  • '+n).join('\n'), src:'Raw Data EN-GHG / Water / Waste' };
  }

  const anyBU = detectBU(qn, DATA_ENERGY) || detectBU(qn, DATA_WASTE);
  if(anyBU && /สรุป|ภาพรวม|ทุกด้าน|ทุกเรื่อง|ทุกหมวด|โปรไฟล์|profile/.test(qn)){
    const yr = detectYear(qn, DATA_ENERGY.years);
    return { text: buProfile(anyBU, yr), src:'Raw Data EN-GHG / Water / Waste' };
  }

  // เป้าหมาย SBTi เชิงตัวเลข (มีกราฟ) มาก่อน FAQ
  if(/sbti|ตามเป้า|เทียบเป้า|พาธ|pathway/.test(qn)){
    const r = sbtiAnswer(detectYear(qn, DATA_ENERGY.years));
    if(r) return r;
  }

  // คำถามเชิงนโยบาย/เป้าหมาย/โครงการ จากรายงานความยั่งยืน
  const noBUmetric = !detectBU(qn, DATA_ENERGY) && !detectBU(qn, DATA_WATER) && !detectBU(qn, DATA_WASTE);
  const faq = faqLookup(qn);
  if(faq && (noBUmetric || /net zero|sbti|เป้าหมาย|นโยบาย|โครงการ|เลิกถ่านหิน|re100|zero waste|zero water|คาร์บอนเครดิต|ปลูกป่า/.test(qn))){
    return { text: faq.a, src:'รายงานความยั่งยืน 2568' };
  }
  if(/intensity|อินเทนซิตี้|ต่อรายได้|ต่อยอดขาย|ความเข้มข้น/.test(qn)){
    const r = intensityAnswer(qn, detectYear(qn, DATA_ENERGY.years));
    if(r) return r;
  }

  const domain = detectDomain(qn);
  if(!domain){
    return { text:'ขอโทษค่ะ ยังไม่แน่ใจว่าถามเรื่องไหน ลองถามได้ทั้ง:\n\nตัวเลข: "พลังงานรวมปี 2025", "GHG ทุก BU", "สรุป CPF THAI", "GHG intensity"\n\nนโยบาย/เป้าหมาย/โครงการ: "เป้าหมาย Net Zero", "SBTi", "RE100", "Zero Waste", "บรรจุภัณฑ์พลาสติก", "คาร์บอนเครดิต"', src:null };
  }
  const dData = DOMAIN_DATA[domain];
  const year = detectYear(qn, dData.years);
  const yi = dData.years.indexOf(year);
  const bu = detectBU(qn, dData);
  const metric = detectMetric(qn, domain);
  const DEFAULT_METRIC = { energy:'energy', water:'consumption', waste:'generated' };

  if(detectAllBU(qn)){
    const mk = metric || DEFAULT_METRIC[domain];
    const mm = METRICS[domain][mk];
    const rows = rankBUs(domain, dData, mk, year);
    const isPct = mm.unit === '%';
    const total = isPct ? 0 : rows.reduce((s,r)=>s+r[1],0);
    const body = rows.map((r,i)=>{
      const share = (!isPct && total) ? ' ('+(r[1]/total*100).toFixed(1)+'%)' : '';
      return '  '+(i+1)+'. '+r[0]+': '+fmt(r[1], mm.unit)+share;
    }).join('\n');
    return { text: mm.label+' — ทุก BU ปี '+year+'\n'+(isPct?'':'รวมทั้งกลุ่ม: '+fmt(dData.group[mk][yi], mm.unit)+'\n')+'\n'+body, src: SOURCE_LABEL[domain] };
  }

  const deep = deepAnswer(qn, domain, dData, bu, year);
  if(deep) return deep;

  if(domain==='energy' && /โซลาร์|solar/.test(qn)){
    const det = getDetail(dData, bu, year);
    const val = det ? (det.energy.renewable_types.Solar || 0) : null;
    if(val===null) return { text:'ไม่พบข้อมูลโซลาร์เซลล์สำหรับ '+(bu||'CP Group')+' ปี '+year+' ค่ะ', src:null };
    return { text:(bu?bu:'CP Group ทั้งหมด')+' ใช้พลังงานจากโซลาร์เซลล์ '+fmt(val,'GJ')+' ในปี '+year+' ค่ะ\n(ไฟล์มีเฉพาะพลังงานที่ใช้จริง ไม่มีข้อมูลกำลังติดตั้ง MW)', src: SOURCE_LABEL.energy };
  }

  let metricKey = metric, usedDefault = false;
  if(!metricKey){ metricKey = DEFAULT_METRIC[domain]; usedDefault = true; }
  const m = METRICS[domain][metricKey];

  let val;
  if(bu){
    if(!dData.bu[bu] || !dData.bu[bu][metricKey]){
      return { text:'ไม่มีข้อมูล '+m.label+' ของ '+bu+' ในชุดข้อมูล '+domain.toUpperCase()+' ค่ะ', src:null };
    }
    val = dData.bu[bu][metricKey][yi];
  } else {
    val = dData.group[metricKey][yi];
  }

  let displayVal = val;
  if(domain==='energy' && metricKey==='renewable'){
    const energyVal = bu ? dData.bu[bu].energy[yi] : dData.group.energy[yi];
    displayVal = energyVal ? (val/energyVal*100) : 0;
  }

  const series = seriesFor(domain, dData, metricKey, bu);
  const goodDir = GOOD_DIR[domain][metricKey];

  let text = opener()+'\n\n'+(bu?bu:'CP Group ทั้งหมด')+' — '+m.label+' ปี '+year+'\n'
           + '  '+fmt(displayVal, m.unit);

  const yl = yoyLine(series, yi, m.unit, goodDir);
  if(yl) text += '\n\n'+yl;

  const rl = rankLine(domain, dData, metricKey, year, bu);
  if(rl) text += '\n'+rl;

  if(usedDefault){
    const others = Object.keys(METRICS[domain]).filter(k=>k!==metricKey)
      .map(k=>METRICS[domain][k].label.split('(')[0].trim()).join(', ');
    text += '\n\n(ตัวเลขหลักของหมวดนี้ — ถามตัวอื่นได้: '+others+' หรือพิมพ์ "แยกรายละเอียด" / "ทุก BU")';
  }
  return { text: text, src: SOURCE_LABEL[domain],
           chart: series ? { series: series, years: dData.years, unit: m.unit } : null };
}

const thread = document.getElementById('thread');

function addBubble(text, isUser, src, chart){
  const row = document.createElement('div');
  row.className = 'msg-row' + (isUser?' user':'');
  if(!isUser){
    const av = document.createElement('div');
    av.className = 'bot-avatar';
    av.textContent = '🌱';
    row.appendChild(av);
  }
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const b = document.createElement('div');
  b.className = 'bubble' + (isUser?' user':'');
  b.textContent = text;
  wrap.appendChild(b);
  if(chart && chart.series && chart.series.length > 1){
    const holder = document.createElement('div');
    holder.innerHTML = sparkSVG(chart.series, chart.years, chart.unit);
    b.appendChild(holder);
  }
  if(src){
    const badge = document.createElement('div');
    badge.className = 'src-badge';
    badge.textContent = '🗂 ' + src;
    wrap.appendChild(badge);
  }
  row.appendChild(wrap);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.id = 'typingRow';
  row.innerHTML = '<div class="bot-avatar">🌱</div>'
    + '<div class="bubble typing"><span></span><span></span><span></span></div>';
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
}

function ask(q){
  addBubble(q, true, null);
  showTyping();
  setTimeout(()=>{
    const t = document.getElementById('typingRow');
    if(t) t.remove();
    const r = answer(q);
    addBubble(r.text, false, r.src, r.chart);
  }, 450);
}

addBubble('สวัสดีค่ะ ถามข้อมูลสิ่งแวดล้อมของ CP Group ได้เลยค่ะ\n\nทั้งตัวเลข (พลังงาน น้ำ ของเสีย ราย BU) และนโยบาย/เป้าหมาย/โครงการ เช่น Net Zero, SBTi, RE100, Zero Waste', false, null);

const qInput = document.getElementById('qInput');

function submitQuestion(){
  const q = qInput.value.trim();
  if(!q) return;
  ask(q);
  qInput.value = '';
  qInput.focus();
}

document.getElementById('sendBtn').addEventListener('click', submitQuestion);
qInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.keyCode === 13){
    e.preventDefault();
    submitQuestion();
  }
});
</script>
